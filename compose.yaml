services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: snowdrop
      POSTGRES_DB: snowdrop_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env.db}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U snowdrop -d snowdrop_dev']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
